<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="1920" height="900"></canvas>
<script>
// Draws the 5 home-page banner backgrounds. Open render.html?n=1..5 at 1920x900 and screenshot.
const n = +new URLSearchParams(location.search).get('n') || 1;
const c = document.getElementById('c'), g = c.getContext('2d'), W = 1920, H = 900;
let seed = n * 9301; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const CY = '#1fd6ec', BL = '#0a6fd0';
function base() {
  const bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#01040b'); bg.addColorStop(1, '#061a36');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const r = g.createRadialGradient(W * .72, H * .45, 0, W * .72, H * .45, 760);
  r.addColorStop(0, 'rgba(15,140,230,.35)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(80,160,255,.06)'; g.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  for (let i = 0; i < 140; i++) { // bokeh
    const x = W * .35 + rnd() * W * .65, y = rnd() * H, s = rnd() * 3 + .5;
    g.fillStyle = `rgba(${rnd() < .5 ? '31,214,236' : '60,140,255'},${rnd() * .5 + .1})`;
    g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();
  }
}
function glow(col, b) { g.shadowColor = col; g.shadowBlur = b; }
function noGlow() { g.shadowBlur = 0; }
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function grad(x0, y0, x1, y1) { const l = g.createLinearGradient(x0, y0, x1, y1); l.addColorStop(0, BL); l.addColorStop(1, CY); return l; }
function panel(x, y, w, h) { rr(x, y, w, h, 22); g.fillStyle = 'rgba(12,26,52,.82)'; g.fill(); g.strokeStyle = 'rgba(80,170,255,.35)'; g.lineWidth = 1.5; g.stroke(); }
function lines(x, y, w, k, a) { for (let i = 0; i < k; i++) { rr(x, y + i * 22, w * (1 - i * .18), 9, 5); g.fillStyle = `rgba(160,200,255,${a})`; g.fill(); } }

base();
if (n === 1) { // city skyline + rising growth line
  let x = 700;
  while (x < W) {
    const w = 40 + rnd() * 90, h = 120 + rnd() * 380;
    g.fillStyle = `rgb(${6 + rnd() * 6},${14 + rnd() * 10},${30 + rnd() * 20})`; g.fillRect(x, H - h, w, h);
    for (let wy = H - h + 14; wy < H - 10; wy += 16) for (let wx = x + 8; wx < x + w - 8; wx += 14)
      if (rnd() < .33) { g.fillStyle = rnd() < .7 ? 'rgba(31,214,236,.55)' : 'rgba(255,255,255,.5)'; g.fillRect(wx, wy, 5, 7); }
    x += w + 4;
  }
  const fade = g.createLinearGradient(0, H - 200, 0, H); fade.addColorStop(0, 'rgba(1,4,11,0)'); fade.addColorStop(1, 'rgba(1,4,11,.9)');
  g.fillStyle = fade; g.fillRect(0, H - 200, W, 200);
  [[1180, 120], [1290, 190], [1400, 270], [1510, 360], [1620, 470]].forEach(([bx, bh]) => { glow(CY, 30); g.fillStyle = grad(0, 600, 0, 600 - bh); rr(bx, 640 - bh, 80, bh, 8); g.fill(); });
  noGlow(); g.lineWidth = 9; g.lineCap = 'round'; glow(CY, 40); g.strokeStyle = '#e9fbff';
  g.beginPath(); g.moveTo(780, 700); g.bezierCurveTo(1100, 690, 1400, 560, 1760, 170); g.stroke();
  g.beginPath(); g.moveTo(1700, 175); g.lineTo(1770, 160); g.lineTo(1765, 235); g.stroke(); noGlow();
}
if (n === 2) { // Google search ad + Meta feed ad on a phone
  g.save(); g.translate(1060, 210); g.rotate(-.06); panel(0, 0, 470, 300);
  g.fillStyle = 'rgba(160,200,255,.18)'; rr(30, 30, 410, 44, 22); g.fill();
  g.fillStyle = CY; g.font = '600 18px sans-serif'; g.fillText('Sponsored', 34, 112);
  rr(34, 128, 330, 16, 8); g.fillStyle = '#8ab8ff'; g.fill(); lines(34, 166, 380, 3, .25);
  g.restore();
  g.save(); g.translate(1460, 120); g.rotate(.05); glow('rgba(31,214,236,.5)', 60);
  rr(0, 0, 330, 640, 46); g.fillStyle = '#071226'; g.fill(); noGlow(); g.strokeStyle = 'rgba(120,190,255,.6)'; g.lineWidth = 3; g.stroke();
  g.fillStyle = grad(0, 0, 300, 300); rr(24, 110, 282, 260, 14); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(50, 74, 18, 0, 7); g.fill(); lines(80, 64, 160, 1, .5);
  lines(24, 392, 282, 2, .3); rr(24, 450, 140, 40, 10); g.fillStyle = CY; g.fill();
  g.restore();
  [[980, 600, 'CTR ↑'], [1640, 690, 'Leads ↑'], [1300, 600, 'CPC ↓']].forEach(([x, y, t]) => { glow(CY, 20); rr(x, y, 150, 54, 27); g.fillStyle = 'rgba(10,40,70,.9)'; g.fill(); noGlow(); g.strokeStyle = CY; g.stroke(); g.fillStyle = '#fff'; g.font = '700 22px sans-serif'; g.fillText(t, x + 28, y + 35); });
}
if (n === 3) { // particles flowing into a glowing funnel
  const fx = 1480, top = 180, bot = 720;
  for (let i = 0; i < 260; i++) {
    const t = rnd(), sx = 760 + rnd() * 400, sy = rnd() * H;
    const ex = fx + (rnd() - .5) * 360 * (1 - t), ey = top + t * (bot - top);
    const x = sx + (ex - sx) * (.4 + rnd() * .6), y = sy + (ey - sy) * (.4 + rnd() * .6);
    glow(CY, 12); g.fillStyle = `rgba(31,214,236,${.3 + rnd() * .6})`; g.beginPath(); g.arc(x, y, 1.5 + rnd() * 3, 0, 7); g.fill();
  }
  noGlow();
  const layers = [[420, 'rgba(10,111,208,.35)'], [320, 'rgba(10,140,220,.45)'], [220, 'rgba(15,170,230,.6)'], [120, 'rgba(31,214,236,.85)']];
  layers.forEach(([w, col], i) => { const y = top + i * 130; glow(CY, 30); g.fillStyle = col; g.beginPath(); g.ellipse(fx, y + 50, w / 2 + 40, 26, 0, 0, 7); g.fill();
    g.beginPath(); g.moveTo(fx - w / 2 - 40, y + 50); g.lineTo(fx - w / 2 + 10, y + 150); g.lineTo(fx + w / 2 - 10, y + 150); g.lineTo(fx + w / 2 + 40, y + 50); g.fill(); });
  noGlow(); glow('#fff', 40); g.fillStyle = '#fff'; g.beginPath(); g.arc(fx, 790, 16, 0, 7); g.fill(); noGlow();
}
if (n === 4) { // performance dashboard: area chart + gauge
  panel(980, 160, 820, 420);
  const pts = [], k = 14; for (let i = 0; i <= k; i++) pts.push([1020 + i * 52, 520 - (Math.pow(i / k, 1.6) * 280 + Math.sin(i * 1.3) * 22)]);
  const area = g.createLinearGradient(0, 220, 0, 540); area.addColorStop(0, 'rgba(31,214,236,.45)'); area.addColorStop(1, 'rgba(31,214,236,0)');
  g.beginPath(); g.moveTo(pts[0][0], 540); pts.forEach(p => g.lineTo(...p)); g.lineTo(pts[k][0], 540); g.fillStyle = area; g.fill();
  glow(CY, 24); g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.strokeStyle = CY; g.lineWidth = 5; g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(...pts[k], 9, 0, 7); g.fill(); noGlow();
  lines(1020, 190, 200, 1, .35);
  panel(1180, 610, 300, 220); panel(1510, 610, 290, 220);
  g.lineWidth = 18; g.lineCap = 'round'; g.strokeStyle = 'rgba(120,170,255,.2)'; g.beginPath(); g.arc(1330, 790, 100, Math.PI, 0); g.stroke();
  glow(CY, 20); g.strokeStyle = grad(1230, 0, 1430, 0); g.beginPath(); g.arc(1330, 790, 100, Math.PI, -.45); g.stroke(); noGlow();
  [60, 95, 75, 130, 160].forEach((h, i) => { g.fillStyle = grad(0, 800, 0, 800 - h); rr(1545 + i * 46, 800 - h, 30, h, 6); g.fill(); });
}
if (n === 5) { // full-service hub: orbit rings with channel nodes + laptop
  const cx = 1430, cy = 400;
  [130, 230, 330].forEach((r, i) => { g.strokeStyle = `rgba(80,170,255,${.35 - i * .08})`; g.lineWidth = 2; g.setLineDash(i === 1 ? [8, 10] : []); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke(); });
  g.setLineDash([]);
  glow(CY, 60); g.fillStyle = grad(cx - 80, cy - 80, cx + 80, cy + 80); g.beginPath(); g.arc(cx, cy, 78, 0, 7); g.fill(); noGlow();
  g.strokeStyle = '#fff'; g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(cx - 40, cy + 25); g.lineTo(cx - 10, cy - 5); g.lineTo(cx + 10, cy + 12); g.lineTo(cx + 42, cy - 28); g.stroke();
  const nodes = [[230, -.4], [230, 1.6], [230, 3.4], [330, .5], [330, 2.4], [330, 4.4], [330, 5.6], [130, 5]];
  nodes.forEach(([r, a], i) => { const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a) * .9; g.strokeStyle = 'rgba(31,214,236,.25)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx, cy); g.lineTo(x, y); g.stroke();
    glow(CY, 25); g.fillStyle = i % 2 ? '#0d3a66' : '#0b5ea8'; g.beginPath(); g.arc(x, y, 30, 0, 7); g.fill(); noGlow(); g.strokeStyle = CY; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 8, 0, 7); g.fill(); });
}
document.title = 'done';
</script></body></html>
